<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f4ed" />
    <meta name="application-name" content="Hemlo" />
    <meta name="apple-mobile-web-app-title" content="Hemlo" />
    <meta name="description" content="Hemlo: the whole of your life in one app. A planner for the day, the meals and the shop." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hemlo</title>
    <!-- The chosen theme before the first paint, from what src/lib/looks.ts kept. -->
    <script>try{var l=JSON.parse(localStorage.getItem('getit.looks'));if(l){var d=l.mode==='system'?matchMedia('(prefers-color-scheme: dark)').matches:l.mode!=='light',v=d?l.dark:l.light,r=document.documentElement;for(var k in v)r.style.setProperty(k,v[k]);r.dataset.theme=d?'dark':'light';if(l.zoom)r.style.zoom=l.zoom;document.querySelector('meta[name="theme-color"]').content=v['--e-paper']}else if(matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.dataset.theme='dark';document.querySelector('meta[name="theme-color"]').content='#15141b'}else{document.documentElement.dataset.theme='light'}}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
