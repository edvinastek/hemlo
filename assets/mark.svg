<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GetIt: a paper page whose margin rule is the day's time rail, with the
       now-dot on it and the day's rows beside it. Colours are the design kit's
       e-paper, e-rail, e-ink and e-accent. -->
  <rect width="1024" height="1024" fill="#f8f4ed"/>
  <g transform="translate(512 512) scale(1.3)">
    <line x1="-150" y1="-250" x2="-150" y2="250" stroke="#cfc6b3" stroke-width="22" stroke-linecap="round"/>
    <line x1="-60" y1="-120" x2="230" y2="-120" stroke="#201e1b" stroke-width="44" stroke-linecap="round"/>
    <line x1="-60" y1="0"    x2="150" y2="0"    stroke="#201e1b" stroke-width="44" stroke-linecap="round"/>
    <line x1="-60" y1="120"  x2="230" y2="120"  stroke="#201e1b" stroke-width="44" stroke-linecap="round"/>
    <circle cx="-150" cy="0" r="58" fill="#b4442a"/>
  </g>
</svg>
