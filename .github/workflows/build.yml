name: Build

# Builds all three clients on GitHub's runners, so no toolchain has to be
# installed anywhere. Download the results from the run's Artifacts section.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Refuse to build with a known vulnerability
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc -b
      - name: Check the calculations against the spec
        run: |
          node --experimental-strip-types src/test/calc.check.mjs
          node --experimental-strip-types src/test/formula.check.mjs
          node --experimental-strip-types src/test/notify.check.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist }

  pages:
    name: Deploy the web client
    # Off unless the repository variable ENABLE_PAGES is "true". GitHub Pages on a
    # private repository needs a paid plan, and on a public one the whole
    # codebase is published; either is a decision, not a default.
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    needs: web
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # A project site lives under /GetIt/, so the build is told where it will sit.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Without this GitHub serves 404 for a deep link, because a single-page
      # app has no file at /plan.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - name: Add the Android project if it is not committed yet
        run: |
          npm i -D @capacitor/cli@8.5.2 @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/local-notifications@8.3.1
          [ -d android ] || npx cap add android
          npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: getit-android
          path: android/app/build/outputs/apk/debug/*.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm i -D @tauri-apps/cli@2.11.5
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: getit-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
