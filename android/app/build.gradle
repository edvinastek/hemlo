import groovy.json.JsonSlurper

// Version comes from package.json so the web, Android and Windows builds of one
// commit always carry the same number. The code must rise with every upload to
// Play; CI passes its run number, a local build falls back to 1.
def getitVersionName() {
    def pkg = new JsonSlurper().parse(rootProject.file('../package.json'))
    return pkg.version
}
def getitVersionCode() {
    def fromCi = System.getenv('GETIT_VERSION_CODE')
    return fromCi ? fromCi.toInteger() : 1
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "app.getit.planner"
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.getit.planner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // One version for every platform, from package.json; CI sets the code.
        versionCode getitVersionCode()
        versionName getitVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // The upload key never sits in the repository. CI supplies it from
            // GitHub secrets; on a laptop it comes from keystore.properties,
            // which .gitignore keeps out of git.
            def props = new Properties()
            def local = rootProject.file('keystore.properties')
            if (local.exists()) local.withInputStream { props.load(it) }
            def path = System.getenv('GETIT_KEYSTORE_PATH') ?: props['storeFile']
            if (path) {
                storeFile file(path)
                storePassword System.getenv('GETIT_KEYSTORE_PASSWORD') ?: props['storePassword']
                keyAlias System.getenv('GETIT_KEY_ALIAS') ?: props['keyAlias']
                keyPassword System.getenv('GETIT_KEY_PASSWORD') ?: props['keyPassword']
            }
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Health Connect, for importing sleep (SLP-05). Its minimum Android is 8;
    // the app's is 7, so the manifest lets it in (overrideLibrary) and the
    // bridge never touches it below Android 9, where Health Connect cannot run.
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation "junit:junit:$junitVersion"
    // The widget's model reads JSON; Android's own org.json is only a stub in
    // plain JVM tests. Robolectric draws the real widget layout in a test so
    // it can be looked at without a phone (TodayWidgetRenderTest).
    testImplementation "org.json:json:20260814"
    testImplementation "org.robolectric:robolectric:4.17"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
